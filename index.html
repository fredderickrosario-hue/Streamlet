<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<title>Streamlet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#0e0f13;--panel:#181a21;--panel2:#20232c;--text:#eceef3;--mut:#8b90a0;--acc:#7c5cff;--err:#ff6b6b;--ok:#4ad295}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--font:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--r:10px;--rb:10px;--tt:none;--ls:0;--hw:650;--clip:none;--pb:none;--btn:#7c5cff;--btnt:#fff}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:10px;align-items:center}
.spaceBtn{background:var(--panel);border:1px solid var(--panel2);border-radius:20px;padding:8px 13px;font-weight:650;white-space:nowrap}
.spaceBtn i{font-style:normal;color:var(--mut);margin-left:4px}
#q{flex:1;min-width:0;background:var(--panel);border:1px solid var(--panel2);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit}
main{padding:0 0 calc(80px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--panel);border-top:1px solid #262933;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:13px 0;color:var(--mut);font-weight:600}
nav button.on{color:var(--acc)}
.row{margin:6px 0 18px}
.row h2{font-size:15px;margin:0 14px 8px;font-weight:var(--hw);text-transform:var(--tt);letter-spacing:var(--ls)}
.row h2 small{color:var(--mut);font-weight:400}
.strip{display:flex;gap:10px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.card{flex:0 0 118px;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-self:flex-start;color:inherit}
.poster{width:118px;height:172px;border-radius:var(--r);clip-path:var(--clip);border:var(--pb);background:linear-gradient(135deg,var(--panel2),color-mix(in srgb,var(--acc) 40%,var(--panel2)));display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:#ffffff55;overflow:hidden;position:relative}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .t{margin-top:6px;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{font-size:12px;color:var(--mut)}
.empty{margin:40px 18px;text-align:center;color:var(--mut)}
.empty h2{color:var(--text);margin:0 0 8px}
.btn{background:var(--btn);border:0;border-radius:var(--rb);padding:10px 16px;font-weight:650;color:var(--btnt)}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn.sm{padding:6px 10px;font-size:13px}
.pad{padding:6px 14px}
.add{display:flex;gap:8px;margin:8px 0}
.add input{flex:1;min-width:0;background:var(--panel);border:1px solid #2a2d38;color:var(--text);border-radius:10px;padding:11px 12px;font:inherit}
.msg{min-height:20px;font-size:13px;margin:2px 0 8px}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.addon{background:var(--panel);border-radius:12px;padding:12px;margin:10px 0}
.addon .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.addon h3{margin:0;font-size:16px}
.addon p{margin:4px 0;color:var(--mut);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{background:var(--panel2);border-radius:20px;padding:2px 9px;font-size:12px;color:var(--mut)}
.url{font-size:11px;color:#5d6275;word-break:break-all;margin-top:6px}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-bottom:40px}
.sheet[hidden]{display:none}
.bar{position:sticky;top:0;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 12px 8px;z-index:2}
.hero{display:flex;gap:14px;padding:6px 14px}
.hero .poster{flex:0 0 110px;width:110px;height:160px}
.hero h2{margin:0 0 4px;font-size:20px}
.hero .meta{color:var(--mut);font-size:13px;margin-bottom:8px}
.desc{padding:4px 14px;color:#c4c8d4;font-size:14px}
.sec{padding:14px 14px 0}
.sec h3{margin:0 0 8px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
.stream{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:var(--panel);border:0;border-radius:10px;padding:11px 12px;margin:6px 0}
.stream .n{flex:1;min-width:0;white-space:pre-line}
.stream .go{color:var(--acc);font-weight:700}
.stream.dis{opacity:.5}
.src{color:var(--mut);font-size:12px;margin:10px 0 2px}
select{background:var(--panel);color:var(--text);border:1px solid #2a2d38;border-radius:8px;padding:7px 10px;font:inherit;margin-bottom:6px}
#player{background:#000;z-index:30;overflow:hidden}
#player video{width:100%;height:100%;background:#000}
#player .x{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:2;background:#000a;border:0;border-radius:20px;padding:8px 14px;color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2a2d38;padding:10px 16px;border-radius:10px;z-index:50;font-size:14px;max-width:88vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.spin{color:var(--mut);padding:10px 14px;font-size:13px}
body.launch header,body.launch nav,body.launch main>section:not(#launcher){display:none}
#launcher{padding:calc(34px + env(safe-area-inset-top)) 16px 40px;max-width:560px;margin:0 auto}
#launcher h1{font-size:28px;margin:0}
#launcher .sub{color:var(--mut);margin:2px 0 18px}
.spaceRow{position:relative}
.space{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:18px;padding:20px 18px;margin:10px 0;color:#fff;box-shadow:0 6px 20px #0006}
.space .em{font-size:36px}
.space .nm{font-size:20px;font-weight:700}
.space .ds{font-size:12.5px;opacity:.85}
.edit{position:absolute;top:18px;right:10px;background:#0005;border:0;border-radius:50%;width:34px;height:34px;color:#fff}
.lnks{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;padding:8px 0}
.f{background:var(--panel);border:1px solid var(--panel2);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;min-width:0}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:#fff}
.chk{display:flex;gap:10px;align-items:center;padding:9px 0}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 4px}
#spaceEd{z-index:25;padding:0 16px 40px}
.hero2{position:relative;margin:4px 14px 18px;border-radius:var(--r);clip-path:var(--clip);overflow:hidden;min-height:310px;display:flex;align-items:flex-end;background:linear-gradient(135deg,var(--panel2),color-mix(in srgb,var(--acc) 55%,var(--panel2)))}
.hero2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.hero2::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 2%,transparent 75%)}
.hero2 .in{position:relative;z-index:1;padding:18px;width:100%}
.hero2 h2{font-size:27px;line-height:1.1;margin:0 0 6px;text-transform:var(--tt);letter-spacing:var(--ls);font-weight:var(--hw);text-shadow:0 2px 12px #000a}
.hero2 p{margin:0 0 12px;color:#e2e4ec;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hbtns{display:flex;gap:10px}
.hb{border:0;border-radius:var(--rb);padding:10px 20px;font-weight:700}
.hb.p{background:var(--btn);color:var(--btnt)}
.hb.s{background:#ffffff2e;color:#fff;backdrop-filter:blur(6px)}
</style>
</head>
<body>
<header>
  <button class="spaceBtn" id="spaceBtn" type="button"></button>
  <input id="q" type="search" placeholder="Search installed addons…" enterkeyhint="search">
</header>
<main>
  <section id="launcher" hidden></section>
  <section id="home"><div id="rows"></div></section>
  <section id="addons" hidden>
    <div class="pad">
      <h2 style="margin:8px 0 2px;font-size:17px">Install an addon</h2>
      <p style="color:var(--mut);margin:0 0 6px;font-size:13px">Streamlet has no content of its own. Paste an addon's manifest URL (https://…/manifest.json or stremio://…). Stream addons are shared by every space; catalog addons are assigned per space (✎ on the front menu).</p>
      <form class="add" id="addForm">
        <input id="addUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://example.com/manifest.json">
        <button class="btn" type="submit">Install</button>
      </form>
      <div class="msg" id="addMsg"></div>
      <button class="btn ghost sm" id="demoBtn" type="button">Try the built-in demo addon</button>
      <h2 style="margin:22px 0 0;font-size:17px">Installed</h2>
      <div id="list"></div>
    </div>
  </section>
</main>

<div id="detail" class="sheet" hidden></div>
<div id="spaceEd" class="sheet" hidden></div>
<div id="player" class="sheet" hidden><button class="x" id="closePlayer">✕ Close</button><video id="vid" controls playsinline></video></div>
<div id="toast"></div>
<nav>
  <button id="tabHome" class="on">Discover</button>
  <button id="tabAddons">Addons</button>
  <button id="tabSpaces">Spaces</button>
</nav>

<script>
/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (k==='class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v!==false && v!=null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) { if (c==null||c===false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2800); }
const enc = encodeURIComponent;

/* ---------- built-in demo addon (openly licensed Blender films) ---------- */
// DEMO-START
const DEMO = {
  'manifest.json': {
    id:'org.streamlet.demo', version:'1.0.0', name:'Blender Open Movies (demo)',
    description:'Sample addon: free, openly licensed short films from the Blender Foundation.',
    resources:['catalog','stream'], types:['movie'], idPrefixes:['blender_'],
    catalogs:[{type:'movie', id:'blender', name:'Open Movies', extra:[{name:'search'}]}]
  },
  'catalog/movie/blender.json': { metas:[
    {id:'blender_bbb',    type:'movie', name:'Big Buck Bunny',  releaseInfo:'2008', description:'A giant rabbit with a heart bigger than himself gets fed up with three bullying rodents.'},
    {id:'blender_sintel', type:'movie', name:'Sintel',          releaseInfo:'2010', description:'A lonely young woman searches for the baby dragon she befriended.'},
    {id:'blender_tos',    type:'movie', name:'Tears of Steel',  releaseInfo:'2012', description:'Sci-fi short: a group of warriors and scientists try to save the world from destructive robots.'},
    {id:'blender_ed',     type:'movie', name:'Elephants Dream', releaseInfo:'2006', description:'The first Blender open movie. Two strange characters explore a capricious and seemingly infinite machine.'}
  ]},
  'stream/movie/blender_bbb.json':    { streams:[{name:'MP4', title:'Big Buck Bunny\n720p', url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'}] },
  'stream/movie/blender_sintel.json': { streams:[{name:'MP4', title:'Sintel\n720p', url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4'}] },
  'stream/movie/blender_tos.json':    { streams:[{name:'MP4', title:'Tears of Steel\n720p', url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4'}] },
  'stream/movie/blender_ed.json':     { streams:[{name:'MP4', title:'Elephants Dream\n720p', url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4'}] }
};
// DEMO-END
function demoRoute(path){
  const m = path.match(/^catalog\/movie\/blender\/search=(.*)\.json$/);
  if (m) { const q = decodeURIComponent(m[1]).toLowerCase(); return {metas: DEMO['catalog/movie/blender.json'].metas.filter(x=>x.name.toLowerCase().includes(q))}; }
  if (DEMO[path]) return DEMO[path];
  throw new Error('HTTP 404');
}

/* ---------- addon store ---------- */
let addons = [];
try { addons = JSON.parse(localStorage.getItem('streamlet.addons') || '[]'); } catch {}
const save = () => { try { localStorage.setItem('streamlet.addons', JSON.stringify(addons)); } catch {} };

async function getJSON(url){
  if (url.startsWith('demo://sample/')) return demoRoute(url.slice('demo://sample/'.length));
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), 12000);
  try {
    const r = await fetch(url, {signal:c.signal});
    if (!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } catch(e) {
    if (e.name==='AbortError') throw new Error('Timed out');
    if (e instanceof TypeError) throw new Error("Couldn't reach it (network error, or the addon doesn't allow CORS)");
    throw e;
  } finally { clearTimeout(t); }
}

function parseAddonUrl(input){
  let u = input.trim();
  if (!u) throw new Error('Paste an addon URL first.');
  if (u.toLowerCase()==='demo') u = 'demo://sample';
  u = u.replace(/^stremio:\/\//i, 'https://');
  if (!/^(https?|demo):\/\//i.test(u)) u = 'https://' + u;
  if (!/manifest\.json(\?.*)?$/.test(u)) u = u.replace(/\/+$/,'') + '/manifest.json';
  return { url:u, base:u.replace(/\/manifest\.json(\?.*)?$/,'') };
}

async function installAddon(input){
  const {url, base} = parseAddonUrl(input);
  const manifest = await getJSON(url);
  if (!manifest || !manifest.id || !manifest.name || !Array.isArray(manifest.resources))
    throw new Error("That doesn't look like a valid addon manifest.");
  if (!manifest.types) manifest.types = [];
  const entry = { url, base, manifest };
  const i = addons.findIndex(a => a.manifest.id === manifest.id);
  if (i>=0) addons[i] = entry; else addons.push(entry);
  save();
  return manifest;
}

function supports(a, res, type, id){
  const m = a.manifest;
  return (m.resources||[]).some(r => {
    const name = typeof r==='string' ? r : r.name;
    if (name !== res) return false;
    const types = r.types || m.types || [];
    const pre = r.idPrefixes || m.idPrefixes;
    return types.includes(type) && (!pre || pre.some(p => String(id).startsWith(p)));
  });
}
function catInfo(cat){
  const ex = cat.extra || [];
  return {
    search: ex.some(e=>e.name==='search') || (cat.extraSupported||[]).includes('search'),
    req: ex.filter(e=>e.isRequired).map(e=>e.name).concat(cat.extraRequired||[])
  };
}

/* ---------- views ---------- */
function showTab(name){
  if (!cur && name==='home') return showLauncher();
  document.body.classList.remove('launch'); $('#launcher').hidden = true;
  $('#home').hidden = name!=='home'; $('#addons').hidden = name!=='addons';
  $('#tabHome').classList.toggle('on', name==='home'); $('#tabAddons').classList.toggle('on', name==='addons');
  $('#spaceBtn').replaceChildren(cur ? cur.emoji+' '+cur.name : 'Spaces', h('i',null,'⇄'));
  $('#q').placeholder = cur ? 'Search '+cur.name+'…' : 'Search…';
  if (name==='home') renderHome($('#q').value.trim()); else renderAddons();
  window.scrollTo(0,0);
}
$('#tabHome').onclick = () => showTab('home');
$('#tabAddons').onclick = () => showTab('addons');
$('#tabSpaces').onclick = () => showLauncher();
$('#spaceBtn').onclick = () => showLauncher();


/* ---------- spaces (front menu) ---------- */
const THEMES = {
  /* originals (kept so older saved spaces still work) */
  violet:{n:'Violet', acc:'#7c5cff', bg:'#0e0f13', panel:'#181a21', panel2:'#20232c'},
  sakura:{n:'Sakura', acc:'#ff5c93', bg:'#150d12', panel:'#22141c', panel2:'#2e1b26'},
  sky:   {n:'Sky',    acc:'#25b9ff', bg:'#0a1420', panel:'#112236', panel2:'#183049'},
  sun:   {n:'Sunny',  acc:'#ffb020', bg:'#14110a', panel:'#221c10', panel2:'#30271a'},
  gold:  {n:'Cinema', acc:'#e8b84a', bg:'#0b0b0b', panel:'#171717', panel2:'#242424'},
  mint:  {n:'Mint',   acc:'#2fd18b', bg:'#0a1411', panel:'#12201b', panel2:'#1a2e27'},
  /* streaming-style looks (original palettes, no logos) */
  googletv:{n:'Smart TV', acc:'#8ab4f8', bg:'#171a1f', panel:'#252a31', panel2:'#323943',
    font:"'Google Sans','Product Sans',Roboto,system-ui,sans-serif", r:'22px', rb:'24px', hw:'500', btnt:'#062e6f'},
  netflix:{n:'Red Carpet', acc:'#e50914', bg:'#141414', panel:'#1f1f1f', panel2:'#2b2b2b',
    font:"'Helvetica Neue',Helvetica,Arial,Roboto,sans-serif", r:'4px', rb:'4px', hw:'700'},
  disney:{n:'Deep Blue', acc:'#3b8bff', bg:'#040714', panel:'#12183a', panel2:'#1c2556',
    font:"'Avenir Next',Avenir,Roboto,system-ui,sans-serif", r:'10px', rb:'8px', hw:'700', pb:'2px solid rgba(249,249,249,.16)'},
  anime: {n:'Orange Pop', acc:'#f47521', bg:'#121316', panel:'#1f2127', panel2:'#2c2f38',
    font:"Lato,Roboto,system-ui,sans-serif", r:'6px', rb:'5px', hw:'800', btnt:'#111'},
  marvel:{n:'Hero Red', acc:'#ec1d24', bg:'#0b0b0d', panel:'#17171a', panel2:'#26262b',
    font:"sans-serif-condensed,'Roboto Condensed','Arial Narrow',Impact,sans-serif", r:'0px', rb:'0px', hw:'800', up:true, ls:'.09em',
    clip:'polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)'}
};
const THEME_DEFAULTS = {font:"system-ui,-apple-system,Segoe UI,Roboto,sans-serif", r:'10px', rb:'10px', up:false, ls:'0', hw:'650', clip:'none', pb:'none', btnt:'#fff'};
function applyTheme(key){
  const t = {...THEME_DEFAULTS, ...(THEMES[key] || THEMES.violet)}, r = document.documentElement.style;
  const set = (k,v) => r.setProperty(k,v);
  set('--acc',t.acc); set('--bg',t.bg); set('--panel',t.panel); set('--panel2',t.panel2);
  set('--font',t.font); set('--r',t.r); set('--rb',t.rb); set('--tt',t.up?'uppercase':'none'); set('--ls',t.ls); set('--hw',t.hw);
  set('--clip',t.clip); set('--pb',t.pb); set('--btn',t.btn||t.acc); set('--btnt',t.btnt);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t.bg;
}
const DEFAULT_SPACES = [
  {id:'aio',     name:'AIO',     emoji:'🌐', theme:'googletv', catalogs:[]},
  {id:'netflix', name:'Netflix', emoji:'🍿', theme:'netflix',  catalogs:[]},
  {id:'disney',  name:'Disney',  emoji:'🏰', theme:'disney',   catalogs:[]},
  {id:'anime',   name:'Anime',   emoji:'🍥', theme:'anime',    catalogs:[]},
  {id:'marvel',  name:'Marvel',  emoji:'🦸', theme:'marvel',   catalogs:[]}
];
let spaces = null;
try { spaces = JSON.parse(localStorage.getItem('streamlet.spaces2') || 'null'); } catch {}
if (!Array.isArray(spaces) || !spaces.length) spaces = JSON.parse(JSON.stringify(DEFAULT_SPACES));
const saveSpaces = () => { try { localStorage.setItem('streamlet.spaces2', JSON.stringify(spaces)); } catch {} };
let cur = null; // the space you're currently in
const spaceAddons = () => (cur && cur.catalogs.length) ? addons.filter(a => cur.catalogs.includes(a.manifest.id)) : addons;

function enterSpace(id){
  cur = spaces.find(s => s.id===id); if (!cur) return;
  applyTheme(cur.theme); $('#q').value = ''; showTab('home');
}
function showLauncher(){
  cur = null; applyTheme('violet');
  document.body.classList.add('launch'); document.body.style.overflow = '';
  $('#detail').hidden = true; $('#player').hidden = true; $('#spaceEd').hidden = true;
  const L = $('#launcher'); L.hidden = false;
  L.replaceChildren(
    h('h1', null, 'Stream', h('span',{style:'color:var(--acc)'},'let')),
    h('p', {class:'sub'}, addons.length ? 'What are we watching?' : 'Install an addon first (Addons & settings below), then pick a space.'),
    ...spaces.map(s => {
      const t = THEMES[s.theme] || THEMES.violet;
      const names = s.catalogs.length ? s.catalogs.map(id => (addons.find(a=>a.manifest.id===id)||{manifest:{}}).manifest.name).filter(Boolean).join(', ') : 'All installed addons';
      return h('div', {class:'spaceRow'},
        h('button', {class:'space', style:`background:linear-gradient(135deg,${t.acc},${t.panel2})`, onclick:()=>enterSpace(s.id)},
          h('span',{class:'em'}, s.emoji), h('span',null, h('div',{class:'nm'}, s.name), h('div',{class:'ds'}, names || 'Selected addon not installed'))),
        h('button', {class:'edit', 'aria-label':'Edit '+s.name, onclick:()=>editSpace(s.id)}, '✎'));
    }),
    h('div', {class:'lnks'},
      h('button', {class:'lnk', onclick:()=>editSpace(null)}, '+ New space'),
      h('button', {class:'lnk', onclick:()=>{ document.body.classList.remove('launch'); $('#launcher').hidden = true; showTab('addons'); }}, 'Addons & settings')));
  window.scrollTo(0,0);
}
function editSpace(id){
  const isNew = !id;
  const s = isNew ? {id:'s'+Date.now().toString(36), name:'', emoji:'📺', theme:'violet', catalogs:[]} : JSON.parse(JSON.stringify(spaces.find(x=>x.id===id)));
  const ed = $('#spaceEd'); ed.hidden = false; ed.scrollTop = 0; applyTheme(s.theme);
  const close = () => { ed.hidden = true; applyTheme(cur ? cur.theme : 'violet'); };
  const name = h('input', {class:'f', placeholder:'Name (e.g. Anime)', style:'flex:1'}); name.value = s.name;
  const emoji = h('input', {class:'f', maxlength:'4', style:'width:70px;text-align:center;font-size:22px'}); emoji.value = s.emoji;
  const sw = h('div', {class:'swatches'});
  const paintSw = () => { sw.replaceChildren(...Object.entries(THEMES).map(([k,t]) =>
    h('button', {type:'button', class:'sw'+(s.theme===k?' on':''), title:t.n, style:`background:${t.acc}`, onclick:()=>{ s.theme=k; applyTheme(k); paintSw(); }}))); };
  paintSw();
  const withCats = addons.filter(a => (a.manifest.catalogs||[]).length);
  const boxes = withCats.map(a => { const cb = h('input', {type:'checkbox'}); cb.checked = s.catalogs.includes(a.manifest.id); return {a, cb}; });
  const del = h('button', {class:'btn ghost', type:'button'}, 'Delete space');
  let armed = false;
  del.onclick = () => {
    if (spaces.length < 2) { toast('Keep at least one space.'); return; }
    if (!armed) { armed = true; del.textContent = 'Tap again to delete'; return; }
    spaces = spaces.filter(x => x.id !== s.id); saveSpaces(); close(); showLauncher();
  };
  ed.replaceChildren(
    h('div', {class:'bar', style:'padding-left:0;padding-right:0'}, h('button', {class:'btn ghost sm', onclick:close}, '← Cancel')),
    h('h2', {style:'margin:6px 0 10px'}, isNew ? 'New space' : 'Edit space'),
    h('div', {class:'lbl'}, 'Icon & name'), h('div', {style:'display:flex;gap:8px'}, emoji, name),
    h('div', {class:'lbl'}, 'Theme'), sw,
    h('div', {class:'lbl'}, 'Catalog addons for this space'),
    withCats.length ? h('div', null, boxes.map(({a,cb}) => h('label', {class:'chk'}, cb, h('span',null, a.manifest.name)))) : h('p', {class:'spin', style:'padding:0'}, 'No catalog addons installed yet.'),
    h('p', {class:'spin', style:'padding:0'}, 'Leave all unchecked to use every installed addon. Stream addons are shared by all spaces.'),
    h('div', {style:'display:flex;gap:10px;margin-top:18px'},
      h('button', {class:'btn', type:'button', onclick:()=>{
        if (!name.value.trim()) { toast('Give it a name.'); return; }
        s.name = name.value.trim(); s.emoji = emoji.value.trim() || '📺';
        s.catalogs = boxes.filter(x => x.cb.checked).map(x => x.a.manifest.id);
        const i = spaces.findIndex(x => x.id===s.id); if (i>=0) spaces[i] = s; else spaces.push(s);
        saveSpaces(); close(); showLauncher();
      }}, 'Save'),
      isNew ? null : del));
}

function posterEl(meta){
  const p = h('div', {class:'poster'}, (meta.name||'?').trim().charAt(0).toUpperCase());
  if (meta.poster) p.append(h('img', {src:meta.poster, loading:'lazy', alt:'', onerror:e=>e.target.remove()}));
  return p;
}

let homeTok = 0;
async function renderHome(query=''){
  const tok = ++homeTok, box = $('#rows');
  box.replaceChildren();
  if (!addons.length) {
    box.append(h('div', {class:'empty'},
      h('h2', null, 'No addons installed'),
      h('p', null, 'Streamlet is an empty shell. Install at least one addon to get catalogs and streams.'),
      h('button', {class:'btn', onclick:()=>showTab('addons')}, 'Install an addon')));
    return;
  }
  const heroBox = h('div'); if (!query) box.append(heroBox);
  let heroDone = false;
  let shown = 0;
  const jobs = [];
  for (const a of spaceAddons()) for (const cat of (a.manifest.catalogs||[])) {
    const info = catInfo(cat);
    if (query ? !info.search : info.req.length) continue;
    const strip = h('div', {class:'strip'});
    const sec = h('div', {class:'row'}, h('h2', null, cat.name || cat.id, ' ', h('small', null, '· '+a.manifest.name)), strip);
    const loading = h('div', {class:'spin'}, 'Loading…');
    sec.append(loading); box.append(sec);
    const path = query ? `catalog/${cat.type}/${enc(cat.id)}/search=${enc(query)}.json` : `catalog/${cat.type}/${enc(cat.id)}.json`;
    jobs.push(getJSON(`${a.base}/${path}`).then(r => {
      if (tok!==homeTok) return;
      const metas = (r.metas||[]);
      if (!metas.length) { sec.remove(); return; }
      shown++; loading.remove();
      if (!heroDone && !query) {
        heroDone = true;
        const hm = metas.find(x => x.background) || metas[0], ht = hm.type || cat.type;
        heroBox.replaceChildren(h('div', {class:'hero2'},
          (hm.background || hm.poster) ? h('img', {src:hm.background || hm.poster, alt:'', onerror:e=>e.target.remove()}) : null,
          h('div', {class:'in'}, h('h2', null, hm.name), hm.description ? h('p', null, hm.description) : null,
            h('div', {class:'hbtns'},
              h('button', {class:'hb p', onclick:()=>openDetail(a, ht, hm)}, '▶ Play'),
              h('button', {class:'hb s', onclick:()=>openDetail(a, ht, hm)}, 'More info')))));
      }
      for (const m of metas) strip.append(h('button', {class:'card', onclick:()=>openDetail(a, m.type||cat.type, m)},
        posterEl(m), h('div', {class:'t'}, m.name), h('div', {class:'s'}, m.releaseInfo || m.year || '')));
    }).catch(e => { if (tok!==homeTok) return; loading.textContent = "Couldn't load: " + e.message; loading.style.color='var(--err)'; }));
  }
  if (!jobs.length) box.append(h('div', {class:'empty'}, query ? 'None of your addons support search.' : 'Your installed addons have no browsable catalogs.'));
  else Promise.all(jobs).then(() => { if (tok===homeTok && query && !shown && !box.querySelector('.spin')) box.append(h('div',{class:'empty'},'No results.')); });
}

function renderAddons(){
  const list = $('#list'); list.replaceChildren();
  if (!addons.length) list.append(h('p', {style:'color:var(--mut)'}, 'Nothing yet.'));
  for (const a of addons) {
    const m = a.manifest;
    const res = m.resources.map(r => typeof r==='string' ? r : r.name);
    list.append(h('div', {class:'addon'},
      h('div', {class:'top'},
        h('div', null, h('h3', null, m.name, ' ', h('small', {style:'color:var(--mut);font-weight:400'}, m.version ? 'v'+m.version : '')), m.description ? h('p', null, m.description) : null),
        h('button', {class:'btn ghost sm', onclick:()=>{ addons = addons.filter(x=>x!==a); save(); renderAddons(); toast('Removed '+m.name); }}, 'Remove')),
      h('div', {class:'tags'}, [...new Set(res)].map(r=>h('span',{class:'tag'},r)), (m.types||[]).map(t=>h('span',{class:'tag'},t))),
      h('div', {class:'url'}, a.url)));
  }
}

$('#addForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const msg = $('#addMsg'); msg.className='msg'; msg.textContent='Installing…';
  try {
    const m = await installAddon($('#addUrl').value);
    msg.className='msg ok'; msg.textContent = `Installed ${m.name}.`; $('#addUrl').value='';
    renderAddons();
  } catch(e) { msg.className='msg err'; msg.textContent = e.message; }
});
$('#demoBtn').onclick = async () => {
  const msg = $('#addMsg');
  try { const m = await installAddon('demo'); msg.className='msg ok'; msg.textContent=`Installed ${m.name}. Head to Discover.`; renderAddons(); }
  catch(e){ msg.className='msg err'; msg.textContent=e.message; }
};
let qT; $('#q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(()=>{ if ($('#home').hidden) showTab('home'); else renderHome($('#q').value.trim()); }, 350); });

/* ---------- detail + streams ---------- */
async function openDetail(addon, type, item){
  const d = $('#detail'); d.hidden = false; d.scrollTop = 0; document.body.style.overflow='hidden';
  let meta = item;
  const body = h('div');
  const close = () => { d.hidden = true; document.body.style.overflow=''; };
  d.replaceChildren(h('div',{class:'bar'}, h('button',{class:'btn ghost sm',onclick:close},'← Back')), body);
  const paint = () => {
    body.replaceChildren(
      h('div',{class:'hero'}, posterEl(meta), h('div',null, h('h2',null,meta.name), h('div',{class:'meta'}, [type, meta.releaseInfo||meta.year, meta.runtime].filter(Boolean).join(' · ')))),
      meta.description ? h('div',{class:'desc'}, meta.description) : null);
  };
  paint();
  const ma = supports(addon,'meta',type,item.id) ? addon : addons.find(x => supports(x,'meta',type,item.id));
  if (ma) { try { const r = await getJSON(`${ma.base}/meta/${type}/${enc(item.id)}.json`); meta = {...item, ...r.meta}; paint(); } catch {} }
  const sec = h('div',{class:'sec'}); body.append(sec);
  if (type==='series' && Array.isArray(meta.videos) && meta.videos.length) {
    const seasons = [...new Set(meta.videos.map(v=>v.season??1))].sort((a,b)=>a-b);
    const sel = h('select',null, seasons.map(s=>h('option',{value:s}, s===0?'Specials':'Season '+s)));
    const eps = h('div'), streams = h('div');
    const showSeason = () => {
      eps.replaceChildren();
      for (const v of meta.videos.filter(v=>(v.season??1)==sel.value))
        eps.append(h('button',{class:'stream',onclick:()=>loadStreams(type,v.id,streams,v.title||v.name||meta.name)}, h('div',{class:'n'}, (v.episode!=null?v.episode+'. ':'')+(v.title||v.name||'Episode')), h('span',{class:'go'},'›')));
    };
    sel.onchange = showSeason; showSeason();
    sec.append(h('h3',null,'Episodes'), sel, eps, streams);
  } else {
    const streams = h('div'); sec.append(streams);
    loadStreams(type, meta.id, streams, meta.name);
  }
}

async function loadStreams(type, id, box, title){
  box.replaceChildren(h('h3',{style:'margin:14px 0 4px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px'},'Streams'));
  const srcs = addons.filter(a => supports(a,'stream',type,id));
  if (!srcs.length) { box.append(h('p',{class:'spin'},'None of your installed addons provide streams for this title. Install one on the Addons tab.')); return; }
  let found = 0;
  await Promise.all(srcs.map(async a => {
    const grp = h('div'); const lab = h('div',{class:'src'}, a.manifest.name+' …'); grp.append(lab); box.append(grp);
    try {
      const r = await getJSON(`${a.base}/stream/${type}/${enc(id)}.json`);
      const ss = r.streams || [];
      lab.textContent = a.manifest.name; found += ss.length;
      if (!ss.length) lab.textContent += ' — nothing found';
      for (const s of ss) {
        const playable = !!(s.url || s.externalUrl || s.ytId);
        grp.append(h('button',{class:'stream'+(playable?'':' dis'), onclick:()=>playStream(s, s.title||title)},
          h('div',{class:'n'}, [s.name, s.title || s.description].filter(Boolean).join('\n') || 'Stream'),
          h('span',{class:'go'}, playable ? '▶' : '✕')));
      }
    } catch(e) { lab.textContent = a.manifest.name+' — failed: '+e.message; lab.style.color='var(--err)'; }
  }));
}

/* ---------- player ---------- */
let hls;
async function playStream(s){
  if (s.externalUrl) { window.open(s.externalUrl,'_blank','noopener'); return; }
  if (s.ytId) { window.open('https://www.youtube.com/watch?v='+enc(s.ytId),'_blank','noopener'); return; }
  if (!s.url) { toast(s.infoHash ? "Torrent stream: needs a debrid service set up in that addon (so it returns direct links), or a backend." : 'This stream type is not supported.'); return; }
  const v = $('#vid'); $('#player').hidden = false;
  v.querySelectorAll('track').forEach(t=>t.remove());
  for (const sub of (s.subtitles||[])) v.append(h('track',{kind:'subtitles', src:sub.url, srclang:sub.lang||'en', label:sub.lang||'Subtitles'}));
  if (/\.m3u8(\?|$)/i.test(s.url) && !v.canPlayType('application/vnd.apple.mpegurl')) {
    try {
      if (!window.Hls) await new Promise((res,rej)=>document.head.append(h('script',{src:'https://cdn.jsdelivr.net/npm/hls.js@1',onload:res,onerror:rej})));
      hls = new Hls(); hls.loadSource(s.url); hls.attachMedia(v);
    } catch { toast("Couldn't load the HLS player."); }
  } else v.src = s.url;
  v.play().catch(()=>{});
}
$('#vid').addEventListener('error', () => toast("Couldn't play that stream."));
$('#closePlayer').onclick = () => {
  const v = $('#vid'); v.pause(); if (hls) { hls.destroy(); hls = null; }
  v.removeAttribute('src'); v.load(); $('#player').hidden = true;
};

/* ---------- boot ---------- */
showLauncher();
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
